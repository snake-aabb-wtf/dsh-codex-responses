name: Release plugin

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Verify release version
        run: |
          version=$(node -p 'require("./package.json").version')
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            printf 'Tag %s does not match package.json version %s.\n' "$GITHUB_REF_NAME" "$version" >&2
            exit 1
          fi
          npm run check

      - name: Pack plugin
        id: pack
        run: |
          archive=$(npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP")
          path="$RUNNER_TEMP/$archive"
          test -f "$path"
          printf 'path=%s\n' "$path" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_PATH: ${{ steps.pack.outputs.path }}
        run: |
          tag="$GITHUB_REF_NAME"
          prerelease=false
          if [[ "${tag%%+*}" == *-* ]]; then
            prerelease=true
          fi

          if ! release=$(gh release view "$tag" --json isDraft,assets 2>/dev/null); then
            gh release create "$tag" "$PACKAGE_PATH" --verify-tag --generate-notes --prerelease="$prerelease"
            exit 0
          fi

          state=$(node -e '
            const { isDraft, assets } = JSON.parse(require("node:fs").readFileSync(0, "utf8"));
            const uploaded = assets.some(asset => asset.name === process.argv[1] && asset.state === "uploaded");
            console.log(isDraft ? "draft" : uploaded ? "uploaded" : "missing");
          ' "$(basename "$PACKAGE_PATH")" <<< "$release")

          case "$state" in
            draft)
              gh release upload "$tag" "$PACKAGE_PATH" --clobber
              gh release edit "$tag" --verify-tag --draft=false --prerelease="$prerelease"
              ;;
            uploaded)
              printf '%s is already uploaded to %s.\n' "$(basename "$PACKAGE_PATH")" "$tag"
              ;;
            missing)
              gh release upload "$tag" "$PACKAGE_PATH"
              ;;
          esac
